# Retired platform orchestrator.
# Keep an exact vhost so wildcard DNS cannot fall through to another service.
server {
    listen 80;
    server_name orchestrator.overnightdesk.com;

    server_tokens off;
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name orchestrator.overnightdesk.com;

    ssl_certificate /etc/letsencrypt/live/orchestrator.overnightdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orchestrator.overnightdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / { return 404; }
}
