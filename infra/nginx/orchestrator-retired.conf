# Retired platform orchestrator.
# Keep an exact vhost so wildcard DNS cannot fall through to another service.
server {
    listen 80;
    server_name orchestrator.overnightdesk.com;

    server_tokens off;
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name orchestrator.overnightdesk.com;

    # This hostname never had a certificate. Reject TLS before selecting any
    # default application certificate or content.
    ssl_reject_handshake on;
}
