# Teams Bot Framework webhook only. The Titus dashboard remains independently
# disabled and is not exposed by this route.
server {
    listen 443 ssl;
    server_name titus-dashboard.overnightdesk.com;

    ssl_certificate /etc/letsencrypt/live/titus-dashboard.overnightdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titus-dashboard.overnightdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. { return 404; }

    location = /api/messages {
        proxy_pass http://hermes-titus:3978;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }

    location / { return 404; }
}
