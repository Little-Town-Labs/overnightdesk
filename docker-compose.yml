services:
  nginx:
    image: nginx:1.27-alpine
    container_name: overnightdesk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - overnightdesk
    cap_drop:
      - ALL
    # nginx entrypoint chowns /var/cache/nginx (tmpfs, fresh each boot) to
    # UID 101 and binds ports 80/443. These four caps are the minimum required.
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
          cpus: "0.05"

  certbot:
    image: certbot/certbot
    container_name: overnightdesk-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  email-fetch:
    build:
      context: /home/ubuntu/email-fetch
      dockerfile: Dockerfile
    container_name: overnightdesk-email-fetch
    profiles:
      - email-fetch
    restart: "no"
    environment:
      - DATABASE_URL
      - EMAIL_ACCOUNTS
      - EMAIL_ADDRESS
      - EMAIL_PASSWORD
      - IMAP_HOST
      - BAT_EMAIL_ADDRESS
      - BAT_EMAIL_PASSWORD
      - BAT_IMAP_HOST
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - SERVICE_NAME
    networks:
      - overnightdesk

  # Shared anti-detection browser service. Hermes tenants connect via
  # CAMOFOX_URL=http://camofox-browser:9377 instead of spawning locally.
  # Built from ~/camofox-browser (jo-inc/camofox-browser repo) — image must
  # be built on the server before first deploy: `make build-arm64` in that dir.
  camofox-browser:
    image: camofox-browser:latest
    container_name: camofox-browser
    restart: unless-stopped
    shm_size: "512m"
    environment:
      CAMOFOX_PORT: "9377"
      CAMOFOX_API_KEY: "${CAMOFOX_API_KEY}"
      CAMOFOX_IDLE_TIMEOUT_MS: "1800000"
    networks:
      - overnightdesk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "9377"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:9377/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.10"

  overnightdesk-ops:
    build:
      context: /home/ubuntu/overnightdesk-ops
      dockerfile: Dockerfile
    container_name: overnightdesk-ops
    env_file:
      - path: /opt/overnightdesk/overnightdesk-ops.env
        required: false
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - /opt/overnightdesk/ops-data:/data
      # Complete platform standard — read-only mounts from the merged Git checkout.
      # The machine loader reads WHAT; HOW and WHY remain available to operators
      # and agent tooling without maintaining a second runtime copy.
      - /home/ubuntu/overnightdesk-platform-standard/WHAT:/app/standard/WHAT:ro
      - /home/ubuntu/overnightdesk-platform-standard/HOW:/app/standard/HOW:ro
      - /home/ubuntu/overnightdesk-platform-standard/WHY:/app/standard/WHY:ro
    environment:
      - KNOWLEDGE_DIR=/app/standard/WHAT
      - MCP_PORT=3000
      - WEB_PORT=3001
      - FACTS_DB_PATH=/data/facts.db
    networks:
      - overnightdesk
    expose:
      - "3000"
      - "3001"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 64m
          cpus: "0.05"

networks:
  overnightdesk:
    driver: bridge
