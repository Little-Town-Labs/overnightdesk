schema_version: "1.0"
profile_version: "1.1.0"

# Operator paths: expand ~ against the operator home before constructing argv.
# The overlay is installed by Little-Town-Labs/development-environment to
# ~/.local/share/ringer-workflows; see its environment.toml.
tools:
  generator: "~/.local/share/ringer-workflows/scripts/delivery_profile.py"
  ringer: "~/src/ringer/ringer.py"
  task_gate: "~/.local/share/ringer-workflows/scripts/task_gate.py"
  ringer_config: "~/.local/share/ringer-workflows/config/config.toml"

routing:
  planning: accountable-lead
  implementation: implementation-worker
  routine_review: routine-reviewer
  quality_gate: quality-reviewer
  fallback: fallback
  max_parallel: 3

bounds:
  task_attempts: 1
  implementation_remediation_rounds: 1
  quality_delta_review_rounds: 1

graph:
  brownfield_feature_system: required-before-planning
  brownfield_micro: targeted-optional
  greenfield_feature_system: after-initial-architecture
  enforcement: generator-validation

safety:
  mutable_risks:
    - routine
  readonly_only_risks:
    - sensitive
    - production
  workers_may_commit: false
  workers_may_push: false
  workers_may_update_canonical_tasks: false
