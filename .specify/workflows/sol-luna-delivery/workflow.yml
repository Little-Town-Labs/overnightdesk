schema_version: "1.0"

workflow:
  id: "sol-luna-delivery"
  name: "Role-Based Spec Kit Delivery"
  version: "1.1.0"
  author: "Timeless Technology Solutions"
  description: "Prepare, approve, and run bounded role-based delivery after Spec Kit analysis"

requires:
  speckit_version: ">=0.12.8"
  integrations:
    any: ["codex"]

inputs:
  feature:
    type: string
    required: true
    prompt: "Active Spec Kit feature directory"
  integration:
    type: string
    default: "codex"

steps:
  - id: prepare-delivery
    command: speckit.ringer-delivery.prepare
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature }}"

  - id: review-route
    type: gate
    message: "Confirm generator validation passed, then review the accepted per-task gate contracts, classification, graph evidence, ownership, lint, and dry-run. Mutable manifests require their generated implementation.config.toml and execute fresh prerequisites, environment, and RED gates before each worker. Brownfield feature/system packages cannot be generated without ready graph evidence."
    options: [approve, reject]
    on_reject: abort

  - id: run-delivery
    command: speckit.ringer-delivery.run
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature }}"
