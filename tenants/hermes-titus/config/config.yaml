model:
  default: "__FROM_PHASE__"
  provider: openai-codex
  base_url: "https://chatgpt.com/backend-api/codex"

plugins:
  enabled:
    - platforms/titus_teams
    - approvals/titus_guarded_email

agent:
  reasoning_effort: medium

approvals:
  # v0.19 changes the upstream default to smart approval. Preserve Titus's
  # existing human approval boundary explicitly across image upgrades.
  mode: manual
  cron_mode: deny

delegation:
  provider: openai-codex
  base_url: "https://chatgpt.com/backend-api/codex"
  model: "gpt-5.6-luna"
  reasoning_effort: high
  orchestrator_enabled: true
  max_concurrent_children: 3
  max_iterations: 30
  max_spawn_depth: 1
  child_timeout_seconds: 600
  inherit_mcp_toolsets: true
  subagent_auto_approve: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: memory_tencentdb

display:
  busy_input_mode: queue

dashboard:
  public_url: "https://titus-dashboard.overnightdesk.com"
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: "https://www.overnightdesk.com/api/auth"
      client_id: "__TITUS_DASHBOARD_OIDC_CLIENT_ID__"
      scopes: "openid profile email"

mcp_servers:
  agentmail:
    url: "https://mcp.agentmail.to/mcp"
    headers:
      x-api-key: "${AGENTMAIL_API_KEY}"
    skip_preflight: true
    connect_timeout: 60
    timeout: 120
    tools:
      include:
        - list_inboxes
        - get_inbox
        - list_threads
        - search_threads
        - get_thread
        - list_messages
        - search_messages
        - get_attachment
  linear:
    url: "https://mcp.linear.app/mcp/readonly"
    enabled: false
    tools:
      resources: false
      prompts: false
  guarded_agentmail:
    command: "/opt/hermes/.venv/bin/python"
    args:
      - "/opt/data/mcp-servers/guarded-agentmail/server.py"
    tools:
      include:
        - titus_prepare_email_approval
        - titus_send_approved_email
      resources: false
      prompts: false
    env:
      AGENTMAIL_API_KEY: "${AGENTMAIL_API_KEY}"
      AGENTMAIL_INBOX_ID: "${AGENTMAIL_INBOX_ID}"
      SECURITY_SERVICE_TOKEN: "${SECURITY_SERVICE_TOKEN}"
      TITUS_GUARDED_EMAIL_STATE: "/opt/data/guarded-agentmail/attempts.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
    connect_timeout: 30
    timeout: 360
    elicitation:
      enabled: true
      timeout: 300

platform_toolsets:
  cli: [hermes-cli]
  teams: [hermes-teams]
  matrix: [hermes-cli]
  telegram: [hermes-cli]

platforms:
  telegram:
    enabled: false
    extra:
      allow_from: []
      group_allow_from: []
      require_mention: false
      guest_mode: false
      observe_unmentioned_group_messages: false
      disable_link_previews: true
  matrix:
    enabled: false
    extra:
      require_mention: false
      session_scope: room
      auto_thread: false
  teams:
    enabled: false
    extra:
      port: 3978
      allow_all_users: false
      require_mention: true

_config_version: 33
